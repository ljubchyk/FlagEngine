[package]
name = "FlagEngine"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.2"
axum = "0.8.9"
r2d2 = "0.8.10"
r2d2_sqlite = "0.35.0"
rusqlite = { version = "0.40.2", features = ["bundled", "uuid"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0.20"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "net"] }

[dev-dependencies]
tempfile = "3"
